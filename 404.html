  p.lead{

    justify-content:center;
    flex-wrap:wrap;

    display:inline-block;
    padding:13px 30px;
    border-radius:999px;

    font-weight:600;
    text-decoration:none;
    transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease;

    color:#fff;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);
    box-shadow:0 10px 24px rgba(27,42,135,.24);
  }
  .btn--main:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(27,42,135,.30)}
  .btn--ghost{
    color:var(--primary);
    background:#fff;
    border:1px solid var(--border);
  }
  .btn--ghost:hover{background:#f7f8fe;transform:translateY(-2px)}
  .quick{
    border-top:1px solid var(--border);
    padding-top:clamp(18px,3vw,24px);
  }
  .quick span{
    display:block;
    font-size:12.5px;
    color:#9aa0b8;
    letter-spacing:.16em;
    margin-bottom:12px;
  }
  .quick ul{

    margin:0;
    padding:0;
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    justify-content:center;
  }
  .quick a{
    color:var(--text-light);
    text-decoration:none;
    font-size:14px;
    padding:3px 0;
    border-bottom:1px solid transparent;
    transition:color .18s ease,border-color .18s ease;

    font-size:12.5px;
    line-height:1.9;
    color:#9aa0b8;

  .foot a{color:var(--primary);text-decoration:none}
  .foot a:hover{color:var(--orange)}
  @media (max-width:520px){
    .brand img{height:32px}
    .btn{padding:12px 22px;font-size:14px}
    .actions{gap:10px}
