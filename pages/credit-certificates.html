<!-- ===================== 证书缩放查看器（带左右翻页） ===================== -->
<div class="zoom-viewer" id="zoomViewer">
  <div class="zoom-bar">
    <span class="zoom-info" id="zoomInfo">1 / 11</span>
    <button class="zoom-btn" id="zoomReset">复位</button>
    <button class="zoom-btn" id="zoomClose">关闭 ✕</button>
  </div>
  <div class="zoom-nav zoom-prev" id="zoomPrev" title="上一张">‹</div>
  <div class="zoom-nav zoom-next" id="zoomNext" title="下一张">›</div>
  <div class="zoom-stage" id="zoomStage">
    <img id="zoomImg" alt="">
  </div>
  <div class="zoom-tip">滚轮缩放 · 拖拽平移 · 左右按钮/方向键翻页 · 双击复位 · Esc 关闭</div>
</div>

<script>
(function(){
  /* ---------- 复用主站：移动端菜单 + 滚动阴影 ---------- */
  var hamburger = document.getElementById('hamburger');
  var nav = document.getElementById('nav');
  var header = document.getElementById('header');
  hamburger.addEventListener('click', function(){
    hamburger.classList.toggle('open'); nav.classList.toggle('open');
  });
  nav.addEventListener('click', function(e){
    if (e.target.tagName === 'A'){ hamburger.classList.remove('open'); nav.classList.remove('open'); }
  });
  window.addEventListener('scroll', function(){
    header.classList.toggle('scrolled', (window.pageYOffset || 0) > 10);
  }, { passive:true });

  /* ---------- 证书数据 ---------- */
  var figures = Array.prototype.slice.call(document.querySelectorAll('.cert-grid figure'));
  var certs = figures.map(function(f){
    var im = f.querySelector('img');
    return { src: im.src, name: im.alt };
  });
  var N = certs.length;

  /* ---------- 缩放查看器 ---------- */
  var viewer = document.getElementById('zoomViewer');
  var stage  = document.getElementById('zoomStage');
  var img    = document.getElementById('zoomImg');
  var info   = document.getElementById('zoomInfo');

  var scale = 1, tx = 0, ty = 0, MIN = 0.5, MAX = 8;
  var idx = 0;
  var isDown = false, sx = 0, sy = 0, stx = 0, sty = 0, moved = false;

  function clamp(v){ return Math.min(MAX, Math.max(MIN, v)); }
  function apply(){
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    info.textContent = (idx + 1) + ' / ' + N + ' · ' + certs[idx].name + ' · ' + Math.round(scale * 100) + '%';
  }
  function load(i){
    idx = (i + N) % N;
    img.src = certs[idx].src; img.alt = certs[idx].name;
    scale = 1; tx = 0; ty = 0; apply();
  }
  function open(i){
    load(i); viewer.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function close(){
    viewer.classList.remove('open'); document.body.style.overflow = ''; img.src = '';
  }
  function zoomAt(factor, clientX, clientY){
    var ns = clamp(scale * factor);
    if (ns === scale) return;
    var rect = stage.getBoundingClientRect();
    var k = 1 - ns / scale;
    tx += (clientX - rect.left - rect.width  / 2) * k;
    ty += (clientY - rect.top  - rect.height / 2) * k;
    scale = ns; apply();
  }

  figures.forEach(function(fig, i){
    fig.addEventListener('click', function(){ open(i); });
  });

  // 滚轮缩放
  viewer.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
  }, { passive:false });

  // 拖拽平移（区分点击与拖动）
  stage.addEventListener('pointerdown', function(e){
    isDown = true; moved = false; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
    stage.classList.add('grabbing');
  });
  window.addEventListener('pointermove', function(e){
    if (!isDown) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    tx = stx + dx; ty = sty + dy; apply();
  });
  window.addEventListener('pointerup', function(e){
    if (!isDown) return;
    isDown = false; stage.classList.remove('grabbing');
    if (!moved && e.target === stage) close();   // 点击空白处关闭
  });
  stage.addEventListener('dblclick', function(){ scale = 1; tx = 0; ty = 0; apply(); });

  // 左右翻页
  document.getElementById('zoomPrev').addEventListener('click', function(e){ e.stopPropagation(); load(idx - 1); });
  document.getElementById('zoomNext').addEventListener('click', function(e){ e.stopPropagation(); load(idx + 1); });

  // 关闭 / 复位 / 键盘
  document.getElementById('zoomClose').addEventListener('click', close);
  document.getElementById('zoomReset').addEventListener('click', function(){ scale = 1; tx = 0; ty = 0; apply(); });
  viewer.addEventListener('click', function(e){ if (e.target === viewer) close(); });
  document.addEventListener('keydown', function(e){
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') load(idx - 1);
    else if (e.key === 'ArrowRight') load(idx + 1);
  });
})();
</script>
